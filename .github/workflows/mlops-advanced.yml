name: Advanced MLOps CI/CD

on:
  push:
    branches:
      - main
      - feature
  pull_request:
    branches:
      - main

jobs:
  mlops:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ./mlruns

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[all] mlflow flake8 docker

      # 4. Pull data using DVC
      - name: Pull DVC data
        run: |
          dvc pull

      # 5. Run lint / tests
      - name: Lint code
        run: flake8 src/ app/

      # 6. Train ML model
      - name: Train model
        run: python src/train.py

      # 7. Log MLflow experiment
      - name: List MLflow runs
        run: mlflow experiments list

      # 8. Build Docker image
      - name: Build Docker image
        run: docker build -t mlops-fasttrack:latest .

      # 9. Log in to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 10. Push Docker image
      - name: Push Docker image
        run: |
          docker tag mlops-fasttrack:latest ghcr.io/${{ github.repository_owner }}/mlops-fasttrack:latest
          docker push ghcr.io/${{ github.repository_owner }}/mlops-fasttrack:latest

      # 11. Deploy to AWS ECS (example)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster mlops-cluster --service mlops-service --force-new-deployment

