stages:
  pull_data:
    cmd: dvc pull
    deps: []
    outs: 
      - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - data/raw
      - src/preprocess.py
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - data/processed
      - src/train.py
    outs:
      - mlruns
      - models/iris_model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - models/iris_model.pkl
      - data/processed
      - src/evaluate.py
    outs:
      - reports/metrics.json

